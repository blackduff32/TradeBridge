name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run demo
      - run: npm run setup
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v4
        id: sui-cache
        with:
          path: .tools/sui
          key: sui-ubuntu-x86_64-1.80.1
      - if: steps.sui-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tools
          curl --fail --location --retry 2 https://github.com/MystenLabs/sui/releases/download/mainnet-v1.80.1/sui-mainnet-v1.80.1-ubuntu-x86_64.tgz | tar -xz -C .tools ./sui
      - run: npm run test:move
